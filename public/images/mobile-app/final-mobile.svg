<!-- Simple SVG placeholder for mobile app final design -->
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
  <rect x="150" y="30" width="100" height="220" fill="white" stroke="#333" stroke-width="2" rx="15"/>
  <rect x="155" y="40" width="90" height="30" fill="#4CAF50" rx="5"/>
  <text x="200" y="60" text-anchor="middle" font-family="Arial" font-size="12" fill="white">Habit Tracker</text>
  
  <!-- Habit items -->
  <rect x="165" y="85" width="70" height="20" fill="#E8F5E8" stroke="#4CAF50" rx="10"/>
  <text x="200" y="98" text-anchor="middle" font-family="Arial" font-size="8" fill="#4CAF50">✓ Exercise</text>
  
  <rect x="165" y="115" width="70" height="20" fill="#E8F5E8" stroke="#4CAF50" rx="10"/>
  <text x="200" y="128" text-anchor="middle" font-family="Arial" font-size="8" fill="#4CAF50">✓ Read</text>
  
  <rect x="165" y="145" width="70" height="20" fill="#FFF3E0" stroke="#FF9800" rx="10"/>
  <text x="200" y="158" text-anchor="middle" font-family="Arial" font-size="8" fill="#FF9800">○ Meditate</text>
  
  <!-- Progress circle -->
  <circle cx="200" cy="190" r="15" fill="none" stroke="#e0e0e0" stroke-width="3"/>
  <circle cx="200" cy="190" r="15" fill="none" stroke="#4CAF50" stroke-width="3" 
          stroke-dasharray="47" stroke-dashoffset="12" transform="rotate(-90 200 190)"/>
  <text x="200" y="195" text-anchor="middle" font-family="Arial" font-size="8" fill="#4CAF50">75%</text>
</svg>
