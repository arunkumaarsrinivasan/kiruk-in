<!-- Simple SVG placeholder for chatbot final design -->
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
  <rect x="0" y="0" width="400" height="50" fill="#4A90E2"/>
  <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="16" fill="white">
    AI Assistant
  </text>
  <rect x="20" y="70" width="280" height="30" fill="#E8F4FD" stroke="#4A90E2" rx="15"/>
  <text x="160" y="90" text-anchor="middle" font-family="Arial" font-size="12" fill="#4A90E2">
    Welcome! I'm here to help you with any questions.
  </text>
  <rect x="100" y="120" width="200" height="30" fill="#50E3C2" rx="15"/>
  <text x="200" y="140" text-anchor="middle" font-family="Arial" font-size="12" fill="white">
    Tell me about your services
  </text>
  <rect x="20" y="170" width="320" height="30" fill="#E8F4FD" stroke="#4A90E2" rx="15"/>
  <text x="180" y="190" text-anchor="middle" font-family="Arial" font-size="12" fill="#4A90E2">
    I can help you with product info, support, and more!
  </text>
  <rect x="20" y="250" width="300" height="30" fill="#F8F8F8" stroke="#ccc" rx="15"/>
  <text x="170" y="270" text-anchor="middle" font-family="Arial" font-size="12" fill="#666">
    Type your message...
  </text>
</svg>
